<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Asesores</title>
<link rel="icon" href="sai.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a84c;--dark:#0e0e0e;--dark2:#1a1a1a;--dark3:#242424;--border:#333;--text:#e8e8e8;--muted:#888;--green:#3fae6a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300}
  .header{text-align:center;padding:16px 24px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0a0a0a 0%,var(--dark) 100%);position:relative}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .sub{font-size:.7rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:5px}
  .main{max-width:480px;margin:40px auto;padding:0 24px}
  .card{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:32px 28px;animation:fi .4s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--gold);letter-spacing:.1em;text-align:center;margin-bottom:8px}
  .card-sub{font-size:.65rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:8px}
  .field label .req{color:var(--gold)}
  .field input{width:100%;background:var(--dark3);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:500;padding:10px 12px;border-radius:2px;outline:none;transition:border-color .2s;letter-spacing:.05em}
  .field input:focus{border-color:var(--gold)}
  .field input::placeholder{color:var(--muted);font-weight:300}
  .field select{width:100%;background:var(--dark3);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:500;padding:10px 12px;border-radius:2px;outline:none;transition:border-color .2s;letter-spacing:.05em}
  .field select:focus{border-color:var(--gold)}
  .fila-doble{display:grid;grid-template-columns:2fr 1fr;gap:10px}
  .seccion-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--gold);letter-spacing:.08em;margin:26px 0 14px;padding-top:18px;border-top:1px solid var(--border)}

  .dropzone{border:2px dashed var(--border);background:var(--dark3);border-radius:4px;padding:22px 14px;text-align:center;margin-top:8px}
  .dropzone p{color:var(--muted);font-size:.8rem;letter-spacing:.05em;margin-bottom:12px}
  .btn-fotos{padding:14px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:8px;transition:background .2s}
  .btn-fotos:hover{background:var(--gold);color:#000}

  .miniaturas{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .mini{position:relative}
  .mini img{width:100%;height:60px;object-fit:cover;border-radius:2px;border:1px solid var(--border)}
  .mini .quitar{position:absolute;top:2px;right:2px;background:#000c;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;cursor:pointer;padding:0}

  .btn{width:100%;padding:14px;background:var(--gold);border:none;color:#000;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:8px;transition:background .2s}
  .btn:hover{background:#dbb85c}
  .btn:disabled{background:#444;color:#888;cursor:not-allowed}

  .msg{margin-top:16px;padding:14px;border-radius:2px;font-size:.75rem;letter-spacing:.05em;text-align:center;display:none}
  .msg.error{background:#2a0a0a;border:1px solid #ff1744;color:#ff6b6b}
  .msg.loading{background:var(--dark3);border:1px solid var(--border);color:var(--gold);font-weight:600}
  .msg.ok{background:#0f2a17;border:1px solid var(--green);color:#7be3a0}

  .footer{text-align:center;padding:26px;font-size:.7rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--border);margin-top:50px}
  .powered{font-size:.55rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:15px}
</style>
</head>

<script>
let CONFIG = null;
let fotosSeleccionadas = []; // array de File

const MAX_FOTOS = 40;
const TANDA = 6;
const MAX_LADO = 1600;   // redimensionamos las fotos a este lado maximo
const CALIDAD_JPG = 0.75;

function parseCSV(csv){
  csv = csv.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const results=[], lines=[];
  let cur='', inQ=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c==='\n'&&!inQ){ lines.push(cur); cur=''; }
    else cur+=c;
  }
  if(cur) lines.push(cur);
  const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
  for(let i=1;i<lines.length;i++){
    const line=lines[i]; if(!line.trim()) continue;
    const values=[], chars=line.split('');
    let val='', q=false;
    for(let j=0;j<chars.length;j++){
      const c=chars[j];
      if(c==='"'){ q=!q; }
      else if(c===','&&!q){ values.push(val.trim()); val=''; }
      else val+=c;
    }
    values.push(val.trim());
    const obj={};
    headers.forEach((h,k)=>obj[h]=values[k]||'');
    results.push(obj);
  }
  return results;
}

// Tabla maestra (misma que usa web.html): slug | csv_url | empresa_url | apps_script_url | cupones_folder_id
const MAPEO_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXUu3L5qPY0nh73olR4CNASmBW4BK-NEIbQ8y36nFCLFYsOEqZNN9WZKDGlnuCxVyjJPTVHN1ouWoz/pub?output=csv";

function obtenerSlugDeUrl(){
  const porQuery = new URLSearchParams(window.location.search).get('_slug');
  if(porQuery){
    const partes = window.location.pathname.split('/').filter(Boolean);
    const base = '/' + (partes[0] || '') + '/';
    try{ history.replaceState(null, '', base + porQuery.trim().toLowerCase() + '/vendedores.html'); }catch(e){}
    return porQuery.trim().toLowerCase();
  }
  const partes = window.location.pathname.split('/').filter(Boolean);
  const resto = partes.slice(1).filter(p => !/\.html?$/i.test(p));
  return (resto[0] || '').trim().toLowerCase();
}

async function cargarConfig() {
  const slug = obtenerSlugDeUrl();
  if(!slug){ mostrarInmobiliariaNoEncontrada(); return; }
  try {
    // 1) Busco la fila de esta inmobiliaria en la tabla maestra
    const resMapeo = await fetch(MAPEO_URL + '?t=' + Date.now(), {cache:'no-store'});
    const filas = parseCSV(await resMapeo.text());
    const fila = filas.find(f => (f.slug || '').trim().toLowerCase() === slug);
    if(!fila || !fila.empresa_url || !fila.apps_script_url){ mostrarInmobiliariaNoEncontrada(); return; }

    // 2) Leo los datos de Empresa de ESA inmobiliaria (mismo Sheet que usa web.html)
    const resEmp = await fetch(fila.empresa_url + (fila.empresa_url.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    const filasEmp = parseCSV(await resEmp.text());
    const datosEmp = filasEmp[0] || {};

    CONFIG = {
      nombre: datosEmp.nombre || '',
      direccion: datosEmp.direccion || '',
      tel: datosEmp.tel || '',
      email: datosEmp.email || '',
      ciudad: datosEmp.ciudad || '',
      appsScriptUrl: fila.apps_script_url
    };

    document.getElementById('hdr-nombre').textContent = CONFIG.nombre || 'SAI+';
    document.getElementById('hdr-sub').textContent = 'Portal de Asesores';
    document.title = (CONFIG.nombre || 'SAI+') + ' — Portal de Asesores';
    let contacto = [];
    if (CONFIG.direccion) contacto.push(CONFIG.direccion);
    if (CONFIG.tel)       contacto.push('Tel: ' + CONFIG.tel);
    if (CONFIG.email)     contacto.push(CONFIG.email);
    document.getElementById('ftr-contacto').textContent = contacto.join('  ·  ');

    // Precarga la Ciudad de la Inmobiliaria en los 2 campos de Ciudad (propiedad
    // y propietario), para ahorrarle tipeo al Asesor - las puede modificar igual
    if (CONFIG.ciudad) {
      document.getElementById('ciudad').value = CONFIG.ciudad.toUpperCase();
      document.getElementById('propCiudad').value = CONFIG.ciudad.toUpperCase();
    }
  } catch (e) {
    console.warn('No se pudo resolver la inmobiliaria:', e);
    mostrarInmobiliariaNoEncontrada();
  }
}

function mostrarInmobiliariaNoEncontrada(){
  document.querySelector('.header').style.display = 'none';
  document.querySelector('.main').innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--muted);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;">Esta inmobiliaria no está disponible.</div>';
  document.querySelector('.footer').style.display = 'none';
  document.title = 'SAI+';
}

document.getElementById('inputFotos').addEventListener('change', function () {
  agregarFotos(this.files);
  this.value = ''; // permite volver a elegir aunque sea el mismo archivo
});

function agregarFotos(fileList) {
  const nuevas = Array.prototype.slice.call(fileList);
  const espacio = MAX_FOTOS - fotosSeleccionadas.length;
  if (espacio <= 0) {
    alert('Ya alcanzo el maximo de ' + MAX_FOTOS + ' fotos.');
    return;
  }
  const aAgregar = nuevas.slice(0, espacio);
  if (nuevas.length > espacio) {
    alert('Solo se agregaron ' + espacio + ' foto(s), es el maximo permitido (' + MAX_FOTOS + ').');
  }
  aAgregar.forEach(function (file) {
    fotosSeleccionadas.push(file);
  });
  dibujarMiniaturas();
}

function dibujarMiniaturas() {
  const cont = document.getElementById('miniaturas');
  cont.innerHTML = '';
  fotosSeleccionadas.forEach(function (file, idx) {
    const div = document.createElement('div');
    div.className = 'mini';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    const btn = document.createElement('button');
    btn.className = 'quitar';
    btn.textContent = '\u00d7';
    btn.onclick = function () { quitarFoto(idx); };
    div.appendChild(img);
    div.appendChild(btn);
    cont.appendChild(div);
  });
}

function quitarFoto(idx) {
  fotosSeleccionadas.splice(idx, 1);
  dibujarMiniaturas();
}

function comprimirFoto(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      let w = img.width, h = img.height;
      if (w > h && w > MAX_LADO) { h = Math.round(h * MAX_LADO / w); w = MAX_LADO; }
      else if (h > MAX_LADO) { w = Math.round(w * MAX_LADO / h); h = MAX_LADO; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', CALIDAD_JPG);
      resolve(dataUrl.split(',')[1]); // solo el base64, sin el prefijo
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo procesar la imagen')); };
    img.src = url;
  });
}

function mostrarMsg(txt, tipo) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + tipo;
  el.style.display = 'block';
}

async function subirDatos() {
  const direccion  = document.getElementById('direccion').value.trim();
  const ciudad     = document.getElementById('ciudad').value.trim();
  const operacion  = document.getElementById('operacion').value.trim();
  const barrio     = document.getElementById('barrio').value.trim();
  const tipologia  = document.getElementById('tipologia').value.trim();
  const ambientes  = document.getElementById('ambientes').value.trim();
  const banos      = document.getElementById('banos').value.trim();
  const precio     = document.getElementById('precio').value.trim();
  const moneda     = document.getElementById('moneda').value.trim();
  const clave      = document.getElementById('clave').value.trim();
  const propNombre    = document.getElementById('propNombre').value.trim();
  const propDireccion = document.getElementById('propDireccion').value.trim();
  const propCiudad    = document.getElementById('propCiudad').value.trim();
  const propMovil      = document.getElementById('propMovil').value.trim();
  const propDni        = document.getElementById('propDni').value.trim();

  if (!direccion || !ciudad || !operacion || !barrio || !tipologia || !ambientes || !banos || !precio || !clave) {
    mostrarMsg('Complete todos los datos de la Propiedad y la Clave de Acceso.', 'error');
    return;
  }
  if (!propNombre || !propDireccion || !propCiudad || !propMovil || !propDni) {
    mostrarMsg('Complete todos los Datos del Propietario.', 'error');
    return;
  }
  if (fotosSeleccionadas.length === 0) {
    mostrarMsg('Seleccione al menos una foto.', 'error');
    return;
  }
  if (!CONFIG || !CONFIG.appsScriptUrl) {
    mostrarMsg('Error de configuracion. Intente mas tarde.', 'error');
    return;
  }

  document.getElementById('btnSubir').disabled = true;
  const total = fotosSeleccionadas.length;

  for (let desde = 0; desde < total; desde += TANDA) {
    const hasta = Math.min(desde + TANDA, total);
    mostrarMsg('Subiendo foto ' + (desde + 1) + ' a ' + hasta + ' de ' + total + '... \u00a1Espere!', 'loading');

    try {
      const fotosBase64 = [];
      for (let i = desde; i < hasta; i++) {
        const b64 = await comprimirFoto(fotosSeleccionadas[i]);
        fotosBase64.push({ nombre: 'foto_' + (i + 1) + '.jpg', base64: b64 });
      }

      const payload = {
        direccion: direccion, ciudad: ciudad, operacion: operacion, barrio: barrio,
        tipologia: tipologia, ambientes: ambientes, banos: banos, precio: precio, moneda: moneda,
        clave: clave,
        propNombre: propNombre, propDireccion: propDireccion, propCiudad: propCiudad,
        propMovil: propMovil, propDni: propDni,
        fotos: fotosBase64
      };

      const resp = await fetch(CONFIG.appsScriptUrl, {
        method: 'POST',
        body: JSON.stringify(payload) // sin header Content-Type explicito -> evita preflight CORS
      });
      const data = await resp.json();

      if (!data.ok) {
        mostrarMsg('Error: ' + data.mensaje, 'error');
        document.getElementById('btnSubir').disabled = false;
        return;
      }
    } catch (err) {
      mostrarMsg('Error de conexion al subir. Verifique su internet e intente de nuevo.', 'error');
      document.getElementById('btnSubir').disabled = false;
      return;
    }
  }

  document.getElementById('cardForm').style.display = 'none';
  document.getElementById('cardOk').style.display = 'block';
}

document.addEventListener('DOMContentLoaded', cargarConfig);
</script>
</body>
</html>
