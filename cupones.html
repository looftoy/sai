<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupones de Pago</title>
<link rel="icon" href="sai.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a84c;--dark:#0e0e0e;--dark2:#1a1a1a;--dark3:#242424;--border:#333;--text:#e8e8e8;--muted:#888;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300}
  .header{text-align:center;padding:16px 24px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0a0a0a 0%,var(--dark) 100%);position:relative}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .sub{font-size:.7rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:5px}
  .main{max-width:480px;margin:40px auto;padding:0 24px}
  .card{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:32px 28px;animation:fi .4s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--gold);letter-spacing:.1em;text-align:center;margin-bottom:8px}
  .card-sub{font-size:.65rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:8px}
  .field label .req{color:var(--gold)}
  .field input{width:100%;background:var(--dark3);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:500;padding:10px 12px;border-radius:2px;outline:none;transition:border-color .2s;letter-spacing:.05em}
  .field input:focus{border-color:var(--gold)}
  .field input::placeholder{color:var(--muted);font-weight:300}
  .btn{width:100%;padding:14px;background:var(--gold);border:none;color:#000;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:8px;transition:background .2s}
  .btn:hover{background:#dbb85c}
  .btn:disabled{background:#444;color:#888;cursor:not-allowed}
  .msg{margin-top:20px;padding:14px;border-radius:2px;font-size:.75rem;letter-spacing:.1em;text-align:center;display:none}
  .msg.error{background:#2a0a0a;border:1px solid #ff1744;color:#ff6b6b}
  .msg.loading{background:var(--dark3);border:1px solid var(--border);color:var(--muted)}
  .result{margin-top:24px;display:none;animation:fi .4s ease both}
  .result-title{font-size:.6rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;text-align:center}
  .pdf-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;transition:all .2s}
  .pdf-btn:hover{background:var(--gold);color:#000}
  .pdf-icon{font-size:1.2rem}
  .info-box{margin-top:14px;padding:12px 14px;background:var(--dark3);border:1px solid var(--border);border-radius:2px;font-size:.7rem;color:var(--muted);text-align:center;line-height:1.6}
  .info-box strong{color:var(--text)}
  .footer{text-align:center;padding:30px;font-size:.7rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--border);margin-top:60px}
  .powered{font-size:.55rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:15px}
</style>
</head>

<body>
<div class="header">
  <div class="logo" id="hdr-nombre">SAI+</div>
  <div class="sub" id="hdr-sub">Portal de Inquilinos</div>
</div>

<div class="main">
  <div class="card">
    <div class="card-title">CUPON DE PAGO</div>
    <div class="card-sub">Ingrese sus datos para acceder a su cupón</div>

    <div class="field">
      <label>Número de Carpeta <span class="req">*</span></label>
      <input type="text" id="nroc" placeholder="Ej: 001" maxlength="6">
    </div>
    <div class="field">
      <label>DNI / Documento <span class="req">*</span> (sin puntos)</label>
      <input type="text" id="dni" placeholder="Ej: 12345678" maxlength="20">
    </div>

    <button class="btn" id="btnBuscar" onclick="buscarCupon()">Buscar mi Cupón</button>

    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <div class="card-sub">Cupón Encontrado!</div>
      <a class="pdf-btn" id="pdfLink" href="#" target="_blank">
        <span class="pdf-icon">📄</span>
        <span>Ver / Descargar PDF</span>
      </a>
      <div class="info-box" id="infoBox"></div>
    </div>
  </div>
</div>

<div class="footer">
  <div id="ftr-contacto"></div>
  <div class="powered">Powered by SAI+ Software Inmobiliario</div>
</div>

<script>
// ================================================================
// CONFIGURACION - se carga desde cupones_config.json
// ================================================================
let CONFIG = null;

function parseCSV(csv){
  csv = csv.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const results=[], lines=[];
  let cur='', inQ=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c==='\n'&&!inQ){ lines.push(cur); cur=''; }
    else cur+=c;
  }
  if(cur) lines.push(cur);
  const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
  for(let i=1;i<lines.length;i++){
    const line=lines[i]; if(!line.trim()) continue;
    const values=[], chars=line.split('');
    let val='', q=false;
    for(let j=0;j<chars.length;j++){
      const c=chars[j];
      if(c==='"'){ q=!q; }
      else if(c===','&&!q){ values.push(val.trim()); val=''; }
      else val+=c;
    }
    values.push(val.trim());
    const obj={};
    headers.forEach((h,k)=>obj[h]=values[k]||'');
    results.push(obj);
  }
  return results;
}

// Tabla maestra (misma que usa web.html): slug | csv_url | empresa_url | apps_script_url | cupones_folder_id
const MAPEO_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXUu3L5qPY0nh73olR4CNASmBW4BK-NEIbQ8y36nFCLFYsOEqZNN9WZKDGlnuCxVyjJPTVHN1ouWoz/pub?output=csv";

function obtenerSlugDeUrl(){
  const porQuery = new URLSearchParams(window.location.search).get('_slug');
  if(porQuery){
    const partes = window.location.pathname.split('/').filter(Boolean);
    const base = '/' + (partes[0] || '') + '/';
    try{ history.replaceState(null, '', base + porQuery.trim().toLowerCase() + '/cupones.html'); }catch(e){}
    return porQuery.trim().toLowerCase();
  }
  const partes = window.location.pathname.split('/').filter(Boolean);
  const resto = partes.slice(1).filter(p => !/\.html?$/i.test(p));
  return (resto[0] || '').trim().toLowerCase();
}

async function cargarConfig() {
  const slug = obtenerSlugDeUrl();
  if(!slug){ mostrarInmobiliariaNoEncontrada(); return; }
  try {
    // 1) Busco la fila de esta inmobiliaria en la tabla maestra
    const resMapeo = await fetch(MAPEO_URL + '?t=' + Date.now(), {cache:'no-store'});
    const filas = parseCSV(await resMapeo.text());
    const fila = filas.find(f => (f.slug || '').trim().toLowerCase() === slug);
    if(!fila || !fila.empresa_url || !fila.cupones_folder_id){ mostrarInmobiliariaNoEncontrada(); return; }

    // 2) Leo los datos de Empresa de ESA inmobiliaria (mismo Sheet que usa web.html)
    const resEmp = await fetch(fila.empresa_url + (fila.empresa_url.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    const filasEmp = parseCSV(await resEmp.text());
    const datosEmp = filasEmp[0] || {};

    CONFIG = {
      nombre: datosEmp.nombre || '',
      direccion: datosEmp.direccion || '',
      tel: datosEmp.tel || '',
      email: datosEmp.email || '',
      cupones_folder_id: fila.cupones_folder_id
    };

    // Aplicar datos de la inmobiliaria
    document.getElementById('hdr-nombre').textContent = CONFIG.nombre || 'SAI+';
    document.getElementById('hdr-sub').textContent = 'Portal de Inquilinos';
    document.title = (CONFIG.nombre || 'SAI+') + ' — Cupones de Pago';
    // Footer
    let contacto = [];
    if (CONFIG.direccion) contacto.push(CONFIG.direccion);
    if (CONFIG.tel)       contacto.push('Tel: ' + CONFIG.tel);
    if (CONFIG.email)     contacto.push(CONFIG.email);
    document.getElementById('ftr-contacto').textContent = contacto.join('  ·  ');
  } catch(e) {
    console.warn('No se pudo resolver la inmobiliaria:', e);
    mostrarInmobiliariaNoEncontrada();
  }
}

function mostrarInmobiliariaNoEncontrada(){
  document.querySelector('.header').style.display = 'none';
  document.querySelector('.main').innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--muted);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;">Esta inmobiliaria no está disponible.</div>';
  document.querySelector('.footer').style.display = 'none';
  document.title = 'SAI+';
}

// ================================================================
// BUSCAR CUPON EN DRIVE
// ================================================================
async function buscarCupon() {
  const nrocRaw = document.getElementById('nroc').value.trim();
  const dniRaw  = document.getElementById('dni').value.trim().replace(/[.\-\s]/g, '');

  if (!nrocRaw || !dniRaw) {
    mostrarMsg('Por favor complete ambos campos.', 'error');
    return;
  }

  if (!CONFIG || !CONFIG.cupones_folder_id) {
    mostrarMsg('Error de configuración. Intente más tarde.', 'error');
    return;
  }

  // Formatear nroc con ceros: 1 → 001
  const nroc3 = nrocRaw.padStart(3, '0');
  const nomPdf = `#${nroc3} ${dniRaw}.pdf`;

  mostrarMsg('Buscando su cupón...', 'loading');
  document.getElementById('btnBuscar').disabled = true;
  document.getElementById('result').style.display = 'none';

  try {
    const folderId = CONFIG.cupones_folder_id;
    const data = await buscarEnDrivePublico(folderId, nomPdf);

    if (data && data.id) {
      const pdfUrl = `https://drive.google.com/file/d/${data.id}/view`;
      const dlUrl  = `https://drive.google.com/uc?export=download&id=${data.id}`;

      document.getElementById('pdfLink').href = pdfUrl;
      document.getElementById('infoBox').innerHTML =
        `<strong>Carpeta #${nroc3} - Documento: ${dniRaw}</strong><br>` +
        `<a href="${dlUrl}" style="color:var(--gold);text-decoration:none;font-size:.65rem;letter-spacing:.1em;">▼ Descargar PDF</a>`;

      ocultarMsg();
      document.getElementById('result').style.display = 'block';
    } else {
      mostrarMsg('No se encontró su cupón. Verifique los datos ingresados.', 'error');
    }
  } catch(e) {
    mostrarMsg('Error al buscar el cupón. Intente nuevamente.', 'error');
    console.error(e);
  } finally {
    document.getElementById('btnBuscar').disabled = false;
  }
}

async function buscarEnDrivePublico(folderId, nomPdf) {
  const API_KEY = 'AIzaSyC4VsJFHao2NMrBN5TM3ZitUGBsvgbSGOg';
  const query = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&pageSize=500&key=${API_KEY}`;

  const resp = await fetch(url);
  if (!resp.ok) throw new Error('Error API Drive: ' + resp.status);
  const data = await resp.json();
  const files = data.files || [];
  const nomLower = nomPdf.toLowerCase();
  return files.find(f => f.name.toLowerCase() === nomLower) || null;
}

function mostrarMsg(txt, tipo) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + tipo;
  el.style.display = 'block';
}

function ocultarMsg() {
  document.getElementById('msg').style.display = 'none';
}

// Enter en los campos
document.addEventListener('DOMContentLoaded', () => {
  cargarConfig();
  document.getElementById('nroc').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('dni').focus(); });
  document.getElementById('dni').addEventListener('keydown',  e => { if(e.key==='Enter') buscarCupon(); });
});
</script>
</body>
</html>
