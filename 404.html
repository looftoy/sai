<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/sai/sai.ico">
<title>SAI+</title>
</head>
<body>
<script>
// ================================================================
// SAI+ - ROUTER DE GITHUB PAGES (404.html)
// GitHub Pages solo permite UN 404.html por sitio. Cualquier URL con
// slug (ej: /sai/loofrentals/web.html) no existe como carpeta real,
// asi que GitHub sirve este archivo en su lugar. Aca detectamos que
// pagina se pidio y con que slug, y redirigimos al archivo real
// (web.html / vendedores.html / cupones.html) pasandole el slug por
// query string, que es lo unico que esos archivos necesitan leer.
// ================================================================
(function () {
  var partes = window.location.pathname.split('/').filter(Boolean);
  // partes[0] = nombre del repo/carpeta (ej "sai"), lo salteamos
  var resto = partes.slice(1);

  var archivo = 'web.html';
  var slugPartes = resto;
  if (resto.length && /\.html?$/i.test(resto[resto.length - 1])) {
    var ultimo = resto[resto.length - 1].toLowerCase();
    if (ultimo === 'vendedores.html') archivo = 'vendedores.html';
    else if (ultimo === 'cupones.html') archivo = 'cupones.html';
    else archivo = 'web.html';
    slugPartes = resto.slice(0, -1);
  }

  var slug = (slugPartes[0] || '').trim().toLowerCase();
  var base = '/' + (partes[0] || '') + '/';

  var destino = base + archivo;
  if (slug) destino += '?_slug=' + encodeURIComponent(slug);

  window.location.replace(destino);
})();
</script>
</body>
</html>
