  :root {
    --gold:#c9a84c;--dark:#0e0e0e;--dark2:#1a1a1a;--dark3:#242424;
    --border:#333;--text:#e8e8e8;--muted:#888;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300}
  .header{text-align:center;padding:16px 24px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0a0a0a 0%,var(--dark) 100%);position:relative}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .sub{font-size:.7rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:5px}
  .social-bar{display:flex;justify-content:center;gap:14px;margin-top:8px}
  .soc-icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;transition:opacity .2s;opacity:.7}
  .soc-icon:hover{opacity:1}
  .soc-icon svg{width:18px;height:18px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;background:var(--dark2);border-bottom:1px solid var(--border);justify-content:center}
  .fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fl{font-size:.6rem;letter-spacing:.2em;color:var(--text);text-transform:uppercase;margin-right:4px;font-weight:700}
  .fb{padding:5px 12px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'Montserrat',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;border-radius:2px}
  .fb:hover{border-color:var(--gold);color:var(--gold)}
  .fb.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
  .bar{padding:12px 24px;font-size:.65rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;background:var(--dark);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .bar span{color:var(--gold)}
  .rbtn{display:flex;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:#000;background:#00e676;border:1px solid #00e676;padding:4px 10px;cursor:pointer;border-radius:2px;font-family:'Montserrat',sans-serif;font-weight:700;transition:all .2s}
  .rbtn:hover{background:#69f0ae;border-color:#69f0ae;color:#000}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;background:var(--border)}
  .card{background:var(--dark2);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;animation:fi .4s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(0,0,0,.6);z-index:2}
  .ct{height:200px;background:var(--dark3);position:relative;overflow:hidden}
  .gal{width:100%;height:100%;position:relative}
  .gslides{display:flex;height:100%;transition:transform .35s ease}
  .gslide{min-width:100%;height:100%;background:var(--dark3);overflow:hidden}
  .gslide img{width:100%;height:100%;object-fit:cover;display:block}
  .gprev,.gnext{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:var(--gold);border:none;width:26px;height:40px;font-size:2.5rem;padding-bottom:7px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0.8;transition:opacity .2s}
  .gprev{left:0;border-radius:0 2px 2px 0}
  .gnext{right:0;border-radius:2px 0 0 2px}
  .card:hover .gprev,.card:hover .gnext{opacity:1}
  .gdots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:5}
  .gdot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:background .2s}
  .gdot.active{background:var(--gold)}
  .gctr{position:absolute;bottom:6px;right:10px;font-size:.5rem;color:rgba(255,255,255,.6);letter-spacing:.1em;z-index:5}
  .ph{width:100%;height:100%;background:linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 50%,#1a1a1a 100%);display:flex;align-items:center;justify-content:center}
  .phi{font-size:2.5rem;opacity:.15}
  .ob{position:absolute;top:12px;left:12px;padding:4px 10px;font-size:.55rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border-radius:2px;color:#fff;z-index:6}
  .cb{position:absolute;top:12px;right:12px;padding:4px 10px;font-size:.55rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border-radius:2px;z-index:6}
  .cbody{padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:12px}
  .cref{font-size:.7rem;color:var(--muted);letter-spacing:.25em;text-transform:uppercase;font-weight:600}
  .ctitle{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;color:var(--text);line-height:1.3}
  .cloc{font-size:.8rem;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:5px;font-weight:500}
  .cloc::before{content:'◈';color:var(--gold);font-size:.7rem}
  .cspecs{display:flex;gap:14px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
  .spec{display:flex;flex-direction:column;gap:3px}
  .sv{color:var(--text);font-weight:600;font-size:.9rem}
  .sl{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  .cprice{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .pa{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--gold)}
  .pp{font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:500}
  .pp-consultar{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#00e676}
  .pp-rebajado{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#ff1744}
  .cl{display:inline-flex;align-items:center;gap:4px;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:5px 9px;transition:all .2s;border-radius:2px;font-weight:600;margin-left:3}
  .cl:hover{background:var(--gold);color:#000}
  .wp-btn{display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;background:#25D366;border:1px solid #25D366;padding:5px 8px;transition:all .2s;border-radius:2px;margin-left:0}
  .wp-btn:hover{background:#1da851;border-color:#1da851}
  .wp-btn svg{width:14px;height:14px;fill:#fff}
  .nores{padding:80px 24px;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;display:none}
  .footer{padding:24px 30px;font-size:.65rem;color:var(--white);letter-spacing:.15em;text-transform:uppercase;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .footer-left{display:flex;flex-direction:column;gap:4px}
  .footer-right{display:flex;flex-direction:column;gap:4px;text-align:right}
  .footer a{color:var(--white);text-decoration:none}.footer a:hover{color:var(--white)}
  .powered{font-size:.5rem;color:var(--white);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
  @media(max-width:480px){.logo{font-size:1.2rem}.grid{grid-template-columns:1fr}.footer{flex-direction:column}.footer-right{text-align:left}}
</style>
</head>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiF6w8XgTuNuvjyr-hobFeQgzo3FhRzndplNQAY9QMWHDpUwf6Ct6yOk09x_S3gYofjNs_f1irzzea/pub?output=csv";

let PROPS = [];

function parseCSV(csv){
  csv = csv.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const results=[], lines=[];
  let cur='', inQ=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c==='\n'&&!inQ){ lines.push(cur); cur=''; }
    else cur+=c;
  }
  if(cur) lines.push(cur);
  const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
  for(let i=1;i<lines.length;i++){
    const line=lines[i]; if(!line.trim()) continue;
    const values=[], chars=line.split('');
    let val='', q=false;
    for(let j=0;j<chars.length;j++){
      const c=chars[j];
      if(c==='"'){ q=!q; }
      else if(c===','&&!q){ values.push(val.trim()); val=''; }
      else val+=c;
    }
    values.push(val.trim());
    const obj={};
    headers.forEach((h,k)=>obj[h]=values[k]||'');
    results.push(obj);
  }
  return results;
}

function mapRow(r){
  const fotos=[];
  for(let i=1;i<=10;i++){
    const id=(r[`foto${i}`]||'').trim();
    if(id) fotos.push(`https://drive.google.com/thumbnail?id=${id}&sz=w800`);
  }
  return {
    ref:       r.ref||r.nro||'',
    nombre:    r.nombre||r.calle||'',
    op:        (r.operacion||r.op||'').toUpperCase().trim(),
    tipo:      (r.tipocasa||r.tipo||'').toUpperCase().trim(),
    barrio:    r.barrio||'',
    ciudad:    r.ciudad||'',
    dorms:     (r.dormitorios||r.dorms||'').toUpperCase().trim(),
    banos:     r.banos||'',
    precio:    r.precio||'',
    moneda:    (r.moneda||'USD').trim(),
    preciox:   (r.preciox||r.precioxq||'').toUpperCase().trim(),
    cat:       (r.categoria||r.cat||'').toUpperCase().trim(),
    supconst:  r.supconst||'',
    suplote:   r.suplote||'',
    garajepla: r.garajepla||'',
    gdrive:    r.gdrive||'',
    fotos:     fotos
  };
}

async function cargarCSV(){
  const grid=document.getElementById('grid');
  grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:40px;color:#4D9C00;letter-spacing:.2em;font-size:1rem;font-weight:700">CARGANDO PROPIEDADES...</p>';
  try{
    const res=await fetch(CSV_URL);
    const text=await res.text();
    const rows=parseCSV(text);
    PROPS=rows.map(mapRow).filter(p=>p.ref&&p.ref!=='9999');
    render();
  }catch(e){
    grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:40px;color:#c62828;letter-spacing:.2em;font-size:.75rem">ERROR AL CARGAR DATOS. RECARGÁ LA PÁGINA.</p>';
    console.error(e);
  }
}

const OP_COLOR = {"EN VENTA":"#4a7fa5","PREVENTA":"#4a7fa5","EN ALQUILER":"#2e7d32","TEMPORADA":"#2e7d32","VENDIDO":"#c62828","ALQUILADO":"#c62828","SUSPENDIDO":"#6a1b9a","RESERVADO":"#6a1b9a"};
const CAT_COLOR = {"LUXURY":"#b8860b","SUPERIOR":"#4a7fa5","ESTANDAR":"#5a8a5a"};

// ── ESTADO ────────────────────────────────────────────────────────────
const GS = {}; // gallery state
let activeOp='TODOS', activeCat='TODOS';

function tc(s){ return s.replace(/\w\S*/g, w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); }
function fp(n){
  const v=parseInt(n);
  if(!v)return'—';
  return v.toLocaleString('es-AR');
}

function goTo(ref, dir, ev){
  if(ev) ev.stopPropagation();
  const s=GS[ref]; if(!s) return;
  s.idx=(s.idx+dir+s.photos.length)%s.photos.length;
  updateGal(ref);
}

function updateGal(ref){
  const s=GS[ref]; if(!s) return;
  const card=document.querySelector(`[data-ref="${ref}"]`); if(!card) return;
  const slides=card.querySelector('.gslides');
  const dots=card.querySelectorAll('.gdot');
  const ctr=card.querySelector('.gctr');
  if(slides) slides.style.transform=`translateX(-${s.idx*100}%)`;
  dots.forEach((d,i)=>d.classList.toggle('active',i===s.idx));
  if(ctr && s.photos.length>1) ctr.textContent=`${s.idx+1}/${s.photos.length}`;
}

function initGal(card, photos, ref){
  GS[ref]={idx:0, photos};
  const slides=card.querySelector('.gslides');
  const dots=card.querySelector('.gdots');
  const ctr=card.querySelector('.gctr');
  slides.innerHTML=photos.map((url,i)=>`
    <div class="gslide"><img src="${url}" alt="Foto ${i+1}" loading="${i===0?'eager':'lazy'}"
      onerror="this.parentElement.innerHTML='<div class=\\'ph\\'><div class=\\'phi\\'>🏠</div></div>'"
    ></div>`).join('');
  if(photos.length>1){
    dots.innerHTML=photos.map((_,i)=>`<div class="gdot${i===0?' active':''}" onclick="event.stopPropagation();goTo('${ref}',${i}-GS['${ref}'].idx,event)"></div>`).join('');
    ctr.textContent=`1/${photos.length}`;
  }
}

function render(){
  const grid=document.getElementById('grid');
  const nores=document.getElementById('nores');
  const OPS_VALIDAS = ['EN VENTA','PREVENTA','EN ALQUILER','TEMPORADA'];
  const filtered=PROPS.filter(p=>{
    if(p.ref==='9999') return false;
    if(!OPS_VALIDAS.includes(p.op)) return false;
    return activeOp==='TODOS'||p.op===activeOp;
  }).sort((a,b)=>{
    const opA=String(a.op||'').toUpperCase(), opB=String(b.op||'').toUpperCase();
    if(opA!==opB) return opA.localeCompare(opB);
    const tA=String(a.tipo||'').toUpperCase(), tB=String(b.tipo||'').toUpperCase();
    if(tA!==tB) return tA.localeCompare(tB);
    return parseFloat(b.precio||0)-parseFloat(a.precio||0);

        <div class="cspecs">
